<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUET Prep AI API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      text-align: center;
    }
    h1 {
      color: #38bdf8;
      margin-top: 0;
      font-size: 1.75rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #0369a1;
      color: #e0f2fe;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">API Operational</div>
    <h1>BUET Prep AI API</h1>
    <p>The backend service for BUET Prep AI is running smoothly.</p>
    <p>API Base URL: <code>/api/v1</code><br>Documentation: <a href="/docs">/docs</a></p>
  </div>
</body>
</html>
